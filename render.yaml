# Render Blueprint — 一鍵部署：PostgreSQL + FastAPI 後端 + Vite 靜態前端
# 在 Render 後台「New > Blueprint」選此 repo 即會依此檔建立所有服務。

databases:
  - name: ai-invest-db
    plan: free
    databaseName: ai_invest
    user: ai_invest

services:
  # ---- 後端 API (FastAPI) ----
  - type: web
    name: ai-invest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-invest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render 自動產生強隨機值
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false # 部署後在後台手動填入（機密，不進 git）
      - key: FINMIND_TOKEN
        sync: false # 選填：FinMind token，留空也可用免費額度
      - key: FRONTEND_ORIGIN
        sync: false # 選填：自訂網域時填入；onrender.com 已由 CORS regex 放行
      - key: ADMIN_EMAILS
        sync: false # 逗號分隔的管理員 email；這些帳號可操作名單/外撥等管理功能
      # ---- Twilio 語音電話（inbound AI 客服）----
      - key: TWILIO_ACCOUNT_SID
        sync: false # 部署後在後台填入
      - key: TWILIO_AUTH_TOKEN
        sync: false # 機密，不進 git
      - key: TWILIO_PHONE_NUMBER
        sync: false # E.164 格式，例：+15551234567
      - key: PUBLIC_BASE_URL
        sync: false # 本服務對外網址，例：https://ai-invest-api.onrender.com
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"

  # ---- 前端 (Vite 靜態網站) ----
  - type: web
    name: ai-invest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: ai-invest-api
          property: host # 取得後端主機名，前端會自動補上 https://
    routes:
      # SPA：所有路徑都回傳 index.html，交給 React Router 處理
      - type: rewrite
        source: /*
        destination: /index.html
